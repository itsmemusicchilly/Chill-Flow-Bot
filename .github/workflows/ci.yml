# Runs on every push to main/master and on every pull request: lint, build, the unit tests, the generated docs, and the browser checks.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build, unit tests, docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Generated docs are up to date
        run: |
          npm run docs
          git diff --exit-code docs || (echo "docs/NODES.md or docs/BLOCKS.md is out of date: run 'npm run docs' and commit the result." && exit 1)

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
